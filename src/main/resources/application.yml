server:
  port: 8080

spring:
  application:
    name: load-balancer

logging:
  level:
    root: INFO
    com.lb: DEBUG

load-balancer:
  algorithm: "round-robin"
  instances:
    - id: backend-1
      host: localhost
      port: 8081
      weight: 2
    - id: backend-2
      host: localhost
      port: 8082
      weight: 1